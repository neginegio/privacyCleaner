[project]
name = "excel-privacy-cleaner"
version = "0.1.0"
description = "Local Windows GUI for anonymizing Japanese personal information in Excel files with Presidio recognizers."
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "PySide6>=6.8.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[tool.pyinstaller]
name = "ExcelPrivacyCleaner"
