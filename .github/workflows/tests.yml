name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # Tests marked local_data need a private sample-data corpus that is
        # intentionally not committed to git (see .gitignore); they only run
        # locally with RUN_LOCAL_DATA_TESTS=1.
        run: python -m pytest tests -v -m "not local_data"
